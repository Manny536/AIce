[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sticky-scorer"
version = "0.1.0"
description = "First scorer for sticky patch custody (AIce / L² agent)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manny536" }]
keywords = ["alignment", "sticky-custody", "patch", "L2", "AIce"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sticky-scorer = "sticky_scorer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
